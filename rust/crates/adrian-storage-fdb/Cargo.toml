[package]
name = "adrian-storage-fdb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FoundationDB implementation of DirectoryStore for the Adrian framework"

[dependencies]
adrian-storage-core = { workspace = true }
# `adrian-storage-testkit` is a non-optional dependency because the fallback
# code path (used when the `fdb` feature is disabled) wraps
# `InMemoryDirectoryStore` to provide an in-process snapshot-isolated KV
# store that exercises the real tuple-layer key-encoding logic without
# requiring libclang at build time or a running FDB cluster at runtime.
# (Layering note: this introduces a Layer 1 → Layer 2 dependency, but the
# testkit is a workspace-internal crate and the dependency is on a thin
# snapshot-isolated `BTreeMap` — no domain semantics leak across the seam.)
adrian-storage-testkit = { workspace = true }
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { workspace = true }
bytes.workspace = true
tracing.workspace = true
# Wave 2 (ADR-010/034/059): backup/restore needs SHA-256 for snapshot
# integrity verification and chrono for PITR timestamps.
sha2.workspace = true
chrono = { workspace = true }
# `foundationdb` is declared as optional so that `cargo check` passes on
# systems without libclang (foundationdb-sys requires it for bindgen). The
# `fdb` feature flag enables the real backend; the in-memory fallback path
# below does not use the FDB client API. See ADR-073.
#
# Wave 1 (T-102): enable `fdb-7_3` (sets FDB_API_VERSION=730 so the bindgen
# build.rs in foundationdb-sys can resolve `api_version` to a const) and
# `embedded-fdb-include` (uses the bundled fdb_c.h shipped inside the
# foundationdb-sys crate so we don't need /usr/include/foundationdb/).
# Both features are required at compile time — they propagate to
# `foundationdb-sys` via the foundationdb meta-crate.
foundationdb = { workspace = true, optional = true, features = [
    "fdb-7_3",
    "embedded-fdb-include",
] }

[features]
default = []
# Enable the real FoundationDB backend. Requires libclang at build time (for
# foundationdb-sys's bindgen step) and the FDB C client library at runtime.
fdb = ["dep:foundationdb"]

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
