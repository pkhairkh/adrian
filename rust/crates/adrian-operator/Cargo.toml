[package]
name = "adrian-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kubernetes operator — DomainController CRD + StatefulSet"

[dependencies]
adrian-directory-service = { path = "../adrian-directory-service" }
adrian-kdc = { path = "../adrian-kdc" }
adrian-storage-fdb = { path = "../adrian-storage-fdb" }
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
async-trait.workspace = true
chrono.workspace = true
# Operator reconcile loop uses futures::StreamExt to drive the
# kube::runtime::Controller stream to completion.
futures = "0.3"
# kube::CustomResource derive adds `#[derive(::schemars::JsonSchema)]` to
# the spec struct (default schema mode) so the CRD's openAPIV3Schema can
# be generated. The crate is already in the dep tree (transitive via
# kube); listing it directly makes the `::schemars` path resolve.
schemars = "0.8"

[dev-dependencies]
# Used by the operator_new_stores_client test to construct a mock
# kube::Client (via kube::Client::new(tower::service_fn(...))).
bytes.workspace = true
http.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
