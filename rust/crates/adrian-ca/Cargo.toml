[package]
name = "adrian-ca"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CA service — cert issuance, revocation, HSM-bound keys"

[features]
default = []
# `enterprise-hsm` is a no-op alias kept for backwards compatibility with
# the tasklist DoD that references it. The `adrian-hsm` crate is now always
# linked (Domain-06 Wave 1: CA signs through HSM trait, ADR-037), so there
# is nothing to gate at this layer — PKCS#11 backend gating lives in the
# `adrian-hsm` crate's own `hsm` feature.
enterprise-hsm = []

[dependencies]
adrian-storage-core = { path = "../adrian-storage-core" }
adrian-storage-fdb = { path = "../adrian-storage-fdb" }
# Domain-06 Wave 1: CA signs through the HSM trait (ADR-037). `adrian-hsm` is
# always-on (not optional) so the CA can use `SoftwareHsm` for dev and a real
# PKCS#11 HSM in production. The `enterprise-hsm` feature is kept as a
# no-op alias for backwards-compat with the tasklist DoD that references it.
adrian-hsm = { path = "../adrian-hsm" }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
rasn.workspace = true
rasn-pkix.workspace = true
ring.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes = "1"
bitvec = "1"
