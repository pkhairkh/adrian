[package]
name = "adrian-identity-fdb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FoundationDB-backed IdentityMapping implementation for the Adrian framework"

[dependencies]
adrian-identity-core = { workspace = true }
adrian-sid = { workspace = true }
adrian-storage-core = { workspace = true }
adrian-storage-fdb = { workspace = true }
adrian-storage-testkit = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { workspace = true }
tracing.workspace = true
bytes.workspace = true
# `foundationdb` is optional — see adrian-storage-fdb/Cargo.toml for rationale.
# Wave 1 (T-102): enables fdb-7_3 + embedded-fdb-include so bindgen resolves
# FDB_API_VERSION and uses the bundled fdb_c.h shipped inside foundationdb-sys.
foundationdb = { workspace = true, optional = true, features = [
    "fdb-7_3",
    "embedded-fdb-include",
] }

[features]
default = []
# Enable the real FoundationDB backend. Requires libclang at build time.
fdb = ["dep:foundationdb", "adrian-storage-fdb/fdb"]

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
