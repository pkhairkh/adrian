[package]
name = "adrian-sdk-swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Swift bindings for the Adrian SDK"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
adrian-sdk = { path = "../adrian-sdk" }
# Wave 3: route new `adrian_swift_sdk_*` entry points through the C ABI
# in `adrian-sdk-c` per ADR-107 §Consequences (the C ABI is the
# foundation for all language bindings — JNI, Swift, Python, Go).
adrian-sdk-c = { path = "../adrian-sdk-c" }
tokio.workspace = true
thiserror.workspace = true
